server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # /precos -> /precos/ (o site usa sempre barra no final)
  absolute_redirect off;

  location /_astro/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri/ =404;
  }

  error_page 404 /404.html;
}
